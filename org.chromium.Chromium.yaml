modules:
  - name: readelf-symlink
    only-arches: [aarch64]
    buildsystem: simple
    build-commands:
      # Chromium expects to find readelf with its full toolprefix on arm64
      - ln -s /usr/bin/readelf /app/bin/aarch64-linux-gnu-readelf

  - name: extensions
    buildsystem: simple
    build-commands:
      - mkdir -p /app/chromium/{extensions,native-messaging-hosts,policies}
      - for dir in native-messaging-hosts policies; do ln -s /app/chromium/{$dir,extensions}/$dir;
        done
      - touch /app/chromium/extensions/no-mount-stamp

  - name: cmake
    buildsystem: simple
    build-options:
      strip: false
      no-debuginfo: true
    cleanup:
      - '*'
    build-commands:
      - cp -r * /app
    sources:
      - type: archive
        url: *cmake_x64_url
        sha256: *cmake_x64_sha256
        only-arches: [x86_64]
      - type: archive
        url: *cmake_arm64_url
        sha256: *cmake_arm64_sha256
        only-arches: [aarch64]

  - name: esbuild
    buildsystem: simple
    build-options:
      strip: false
      no-debuginfo: true
    cleanup:
      - '*'
    build-commands:
      - mkdir -p /app/lib/sdk/esbuild
      - mv bin /app/lib/sdk/esbuild
    sources:
      - type: archive
        url: *esbuild_x64_url
        sha512: *esbuild_x64_sha512
        only-arches: [x86_64]
      - type: archive
        url: *esbuild_arm64_url
        sha512: *esbuild_arm64_sha512
        only-arches: [aarch64]

  - name: chromium
    buildsystem: simple
    build-commands:
      - ./bootstrap.sh
      - ./build.sh
      - ./install.sh
    sources:
      - type: archive
        url: *chromium_url
        sha256: *chromium_sha256
      - type: archive
        url: *llvm_prebuilt_x64_url
        sha256: *llvm_prebuilt_x64_sha256
        dest: third_party/llvm-build/Release+Asserts
        strip-components: 0
        only-arches: [x86_64]
      - type: archive
        url: *llvm_prebuilt_arm64_url
        sha256: *llvm_prebuilt_arm64_sha256
        dest: third_party/llvm-build/Release+Asserts
        strip-components: 0
        only-arches: [aarch64]
      - type: archive
        url: *clang_format_arm64_url
        sha256: *clang_format_arm64_sha256
        dest: _clang-format-bin
        strip-components: 0
        only-arches: [aarch64]
      - type: shell
        commands:
          - mv _clang-format-bin/bin/clang-format buildtools/linux64-format/
        only-arches: [aarch64]
      - type: archive
        url: *rust_prebuilt_x64_url
        sha256: *rust_prebuilt_x64_sha256
        dest: third_party/rust-toolchain
        strip-components: 0
        only-arches: [x86_64]
      - type: archive
        url: *rust_prebuilt_arm64_url
        sha256: *rust_prebuilt_arm64_sha256
        dest: third_party/rust-toolchain
        strip-components: 0
        only-arches: [aarch64]
      - type: shell
        commands:
          - cp third_party/rust-toolchain/lib/libclang.so third_party/llvm-libclang/lib/
        only-arches: [aarch64]
      - type: archive
        archive-type: zip
        url: *dawn_go_x64_url
        sha256: *dawn_go_x64_sha256
        dest: third_party/dawn/tools/golang/linux-amd64
        strip-components: 0
        only-arches: [x86_64]
      - type: archive
        archive-type: zip
        url: *dawn_go_arm64_url
        sha256: *dawn_go_arm64_sha256
        dest: third_party/dawn/tools/golang/linux-arm64
        strip-components: 0
        only-arches: [aarch64]
      - type: shell
        commands:
          - rm -rf third_party/typescript/linux-amd64/src
        only-arches: [aarch64]
      - type: archive
        url: *ts_arm64_url
        sha256: *ts_arm64_sha256
        dest: third_party/typescript/linux-amd64/src
        only-arches: [aarch64]
      - type: shell
        commands:
          - |
            set -ex
            for p in third_party/typescript/linux-amd64/3pp/patches/*.patch; do
              patch -d third_party/typescript/linux-amd64/src -p1 < "$p"
            done
        only-arches: [aarch64]
      - patches/chromium/_sources.json
      # TODO: drop this when we move to 26.08
      - type: patch
        path: patches/webrtc-pipewire-backport.patch
        options: [-dthird_party/webrtc]
