app-id: org.chromium.Chromium
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
base: org.chromium.Chromium.BaseApp
base-version: '25.08'
command: chromium
finish-args:
  - --require-version=1.8.2
  - --filesystem=home
  - --filesystem=/run/.heim_org.h5l.kcm-socket
  - --device=all
  - --env=LD_LIBRARY_PATH=/app/chromium/nonfree-codecs/lib
  - --share=ipc
  - --share=network
  - --socket=cups
  - --socket=pulseaudio
  - --socket=x11
  - --socket=wayland
  - --system-talk-name=org.bluez
  - --system-talk-name=org.freedesktop.Avahi
  - --system-talk-name=org.freedesktop.UPower
  - --talk-name=com.canonical.AppMenu.Registrar
  - --talk-name=org.freedesktop.FileManager1
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.freedesktop.ScreenSaver
  - --talk-name=org.freedesktop.secrets
  - --talk-name=org.kde.kwalletd5
  - --talk-name=org.kde.kwalletd6
  - --talk-name=org.gnome.SessionManager
  - --own-name=org.mpris.MediaPlayer2.chromium.*

add-extensions:
  org.chromium.Chromium.Codecs:
    directory: chromium/nonfree-codecs
    add-ld-path: lib
    bundle: true
    autodelete: true

  org.chromium.Chromium.NativeMessagingHost:
    version: '1'
    directory: chromium/native-messaging-hosts
    merge-dirs: native-messaging-hosts
    subdirectories: true
    no-autodownload: true
    autodelete: true

  org.chromium.Chromium.Extension:
    version: '1'
    directory: chromium/extensions
    merge-dirs: extensions;native-messaging-hosts;policies/managed;policies/recommended
    subdirectories: true
    no-autodownload: true
    autodelete: true

  org.chromium.Chromium.Policy:
    version: '1'
    directory: chromium/policies
    merge-dirs: policies/managed;policies/recommended
    subdirectories: true
    no-autodownload: true
    autodelete: true

sdk-extensions:
  - org.freedesktop.Sdk.Extension.llvm22
  - org.freedesktop.Sdk.Extension.node24
  - org.freedesktop.Sdk.Extension.openjdk21

modules:
  - name: readelf-symlink
    only-arches: [aarch64]
    buildsystem: simple
    build-commands:
      # Chromium expects to find readelf with its full toolprefix on arm64
      - ln -s /usr/bin/readelf /app/bin/aarch64-linux-gnu-readelf

  - name: extensions
    buildsystem: simple
    build-commands:
      - mkdir -p /app/chromium/{extensions,native-messaging-hosts,policies}
      - for dir in native-messaging-hosts policies; do ln -s /app/chromium/{$dir,extensions}/$dir;
        done
      - touch /app/chromium/extensions/no-mount-stamp

  - name: cmake
    buildsystem: cmake-ninja
    build-options:
      strip: false
      no-debuginfo: true
    sources:
      - type: archive
        # https://source.chromium.org/chromium/chromium/src/+/main:tools/clang/scripts/build.py;l=295-305;drc=5bb67b4c751b8750bdef29fccbdebc388bf837b5
        url: https://github.com/Kitware/CMake/releases/download/v3.26.4/cmake-3.26.4.tar.gz
        sha256: 313b6880c291bd4fe31c0aa51d6e62659282a521e695f30d5cc0d25abbd5c208
    cleanup:
      - '*'

  - name: esbuild
    buildsystem: simple
    build-options:
      strip: false
      no-debuginfo: true
    cleanup:
      - '*'
    build-commands:
      - mkdir -p /app/lib/sdk/esbuild
      - mv bin /app/lib/sdk/esbuild
    sources:
      - type: archive
        url: https://registry.npmjs.org/@esbuild/linux-x64/-/linux-x64-0.25.1.tgz
        sha256: a3972c20d19545792ba6c6abe564b61c91f66cfa242ff9bffd9e5d59c65452e5
        only-arches: [x86_64]
      - type: archive
        url: https://registry.npmjs.org/@esbuild/linux-arm64/-/linux-arm64-0.25.1.tgz
        sha256: 70771c9212585cfd1b190465f92dae98d1d3fc4a4fab5cacbef71457ee08e254
        only-arches: [aarch64]

  # Do NOT put any modules without strip=false and no-debuginfo=true below this
  # one, otherwise the shared libraries shipped here get corrupted.
  - name: rust-nightly
    buildsystem: simple
    build-options:
      strip: false
      no-debuginfo: true
    cleanup:
      - '*'
    sources:
      - type: archive
        only-arches:
          - aarch64
        dest: rust
        url: https://static.rust-lang.org/dist/2026-08-10/rust-nightly-aarch64-unknown-linux-gnu.tar.xz
        sha256: 41b5a977c8c975f3f81a2e565b6be920caf12bc6d5eea0b2b4f4208a39e24455
        # x-checker-data:
        #  type: rust
        #  package: rust
        #  channel: nightly
        #  target: aarch64-unknown-linux-gnu
      - type: archive
        only-arches:
          - x86_64
        dest: rust
        url: https://static.rust-lang.org/dist/2026-08-10/rust-nightly-x86_64-unknown-linux-gnu.tar.xz
        sha256: d802d6b565a10b9930df5da080df307db9347bc169ae973c58e1f1b8bfa6c669
        # x-checker-data:
        #  type: rust
        #  package: rust
        #  channel: nightly
        #  target: x86_64-unknown-linux-gnu
      - type: archive
        dest: rust-src
        url: https://static.rust-lang.org/dist/2026-08-10/rust-src-nightly.tar.xz
        sha256: 39627a42f9873f0c17d16e311e89caba82d319ad034e3f57399f1f3a8b051fa4
        # x-checker-data:
        #  type: rust
        #  package: rust-src
        #  channel: nightly
        #  target: '*'
    build-commands:
      - cd rust && ./install.sh --prefix=/app/lib/sdk/rust-nightly --without=rust-docs
        --without=rust-docs-json-preview --disable-ldconfig --verbose
      - cd rust-src && ./install.sh --prefix=/app/lib/sdk/rust-nightly --disable-ldconfig
        --verbose

  - name: rust-bindgen
    buildsystem: simple
    build-options:
      strip: false
      no-debuginfo: true
      prepend-path: /app/lib/sdk/rust-nightly/bin
      env:
        CARGO_HOME: /run/build/rust-bindgen/cargo
    build-commands:
      - cargo --offline fetch --manifest-path Cargo.toml --verbose
      - cargo --offline build --release --verbose
      - install -Dm 755 target/release/bindgen -t /app/lib/sdk/bindgen/bin
      - ln -s /app/lib/sdk/rust-nightly/bin/rustfmt /app/lib/sdk/bindgen/bin
    sources:
      - type: git
        url: https://chromium.googlesource.com/external/github.com/rust-lang/rust-bindgen
        commit: 2426dd68cd12e0ac022bca18efb9c7d0acd27e12
      - ./generated-sources.bindgen.json
    cleanup:
      - '*'

  - name: chromium
    buildsystem: simple
    build-options:
      prepend-ld-library-path: /app/lib/sdk/rust-nightly/lib
    build-commands:
      - ./bootstrap.sh
      - ./build.sh
      - ./install.sh
    sources:
      - type: archive
        url: https://github.com/chromium-linux-tarballs/chromium-tarballs/releases/download/153.0.8010.36/chromium-153.0.8010.36-linux.tar.xz
        sha256: 5e2e8fe8c990e591b26237ed0fb9747a76f9da3eac439d7a726000879c468735
        x-checker-data:
          type: chromium
          component: chromium
          is-main-source: true
      - type: shell
        commands:
          - rm -rf third_party/llvm-build
          - rm -rf third_party/rust-toolchain
      - type: archive
        url: https://commondatastorage.googleapis.com/chromium-browser-clang/Linux_x64/clang-llvmorg-24-init-3796-g20e97c4b-2.tar.xz
        sha256: 86d53b33007a35695645e3867589a20f6f8aeedd146331e1a2ec8fd371e05ea2
        dest: third_party/llvm-build/Release+Asserts
        strip-components: 0
        only-arches: [x86_64]
        x-checker-data:
          type: chromium
          component: llvm-prebuilt
      - type: archive
        url: https://commondatastorage.googleapis.com/chromium-browser-clang/Linux_x64/rust-toolchain-0913b18e489ac1011b580e31fa5559654be12bfc-2-llvmorg-24-init-3796-g20e97c4b.tar.xz
        sha256: 4b131e81d157a97bcf454ad0fbb71bc2063b2a3708c858410c04201ef06134e5
        dest: third_party/rust-toolchain
        strip-components: 0
        only-arches: [x86_64]
        # TODO
        # x-checker-data:
        #   type: chromium
        #   component: llvm-prebuilt
      - type: shell
        commands:
          - rm -rf third_party/llvm
        only-arches: [aarch64]
      - type: git
        url: https://chromium.googlesource.com/external/github.com/llvm/llvm-project
        commit: llvmorg-24-init-3796-g20e97c4b
        dest: third_party/llvm
        only-arches: [aarch64]
        x-checker-data:
          type: chromium
          component: llvm-git
      - type: archive
        url: https://npm.skia.org/chrome-devtools/@rollup%2frollup-linux-arm64-gnu/-/rollup-linux-arm64-gnu-4.60.4.tgz
        sha256: 7b98541552d3d679d4a92a04d590b34d1b44a6ec582483be9a66e8bdc31a06f6
        dest: third_party/devtools-frontend/src/node_modules/@rollup/rollup-linux-arm64-gnu
      - type: archive
        archive-type: zip
        url: https://chrome-infra-packages.appspot.com/dl/infra/3pp/tools/go/linux-amd64/+/version:3@1.25.0
        sha256: ab5baab4adb9575a404fc9333855cf57939ddd4f7fd5a59b89a4b130da8343b7
        dest: third_party/dawn/tools/golang/linux-amd64
        strip-components: 0
        only-arches: [x86_64]
      - type: archive
        archive-type: zip
        url: https://chrome-infra-packages.appspot.com/dl/infra/3pp/tools/go/linux-arm64/+/version:3@1.25.0
        sha256: 574c1a46a6a4677bb645aabe886cabe0c20610a4e4edd6e2c3a016096bd5de6b
        dest: third_party/dawn/tools/golang/linux-arm64
        strip-components: 0
        only-arches: [aarch64]
      - type: shell
        commands:
          - rm -rf third_party/typescript/linux-amd64/src
        only-arches: [aarch64]
      - type: archive
        url: https://registry.npmjs.org/@typescript/typescript-linux-arm64/-/typescript-linux-arm64-7.0.2.tgz
        sha256: c83d931ac9dd7549cde6e71246aa9d6a9812843023df3e277fe3b5dcf41dd0ea
        dest: third_party/typescript/linux-amd64/src
        only-arches: [aarch64]
      - type: shell
        commands:
          - patch -d third_party/typescript/linux-amd64/src -p1 -i ../3pp/patches/typescript_native_preview.patch
        only-arches: [aarch64]
      - patches/chromium/_sources.json
      # TODO: drop this when we move to 26.08
      - type: patch
        path: patches/webrtc-pipewire-backport.patch
        options: [-dthird_party/webrtc]
      - type: file
        path: org.chromium.Chromium.desktop
      - type: file
        path: org.chromium.Chromium.metainfo.xml
      - type: file
        path: chromium.sh
      - type: file
        path: unlink_profiles.py
      - type: file
        path: cobalt.ini
      - type: dir
        path: build-aux
