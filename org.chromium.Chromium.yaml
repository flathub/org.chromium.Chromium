modules:
  - name: readelf-symlink
    only-arches: [aarch64]
    buildsystem: simple
    build-commands:
      # Chromium expects to find readelf with its full toolprefix on arm64
      - ln -s /usr/bin/readelf /app/bin/aarch64-linux-gnu-readelf

  - name: extensions
    buildsystem: simple
    build-commands:
      - mkdir -p /app/chromium/{extensions,native-messaging-hosts,policies}
      - for dir in native-messaging-hosts policies; do ln -s /app/chromium/{$dir,extensions}/$dir;
        done
      - touch /app/chromium/extensions/no-mount-stamp

  - name: cmake
    buildsystem: simple
    build-options:
      strip: false
      no-debuginfo: true
    cleanup:
      - '*'
    build-commands:
      - cp -r * /app
    sources:
      - type: archive
        url: *cmake_x64_url
        sha256: *cmake_x64_sha256
        only-arches: [x86_64]
      - type: archive
        url: *cmake_arm64_url
        sha256: *cmake_arm64_sha256
        only-arches: [aarch64]

  - name: esbuild
    buildsystem: simple
    build-options:
      strip: false
      no-debuginfo: true
    cleanup:
      - '*'
    build-commands:
      - mkdir -p /app/lib/sdk/esbuild
      - mv bin /app/lib/sdk/esbuild
    sources:
      - type: archive
        url: *esbuild_x64_url
        sha512: *esbuild_x64_sha512
        only-arches: [x86_64]
      - type: archive
        url: *esbuild_arm64_url
        sha512: *esbuild_arm64_sha512
        only-arches: [aarch64]

  # Do NOT put any modules without strip=false and no-debuginfo=true below this
  # one, otherwise the shared libraries shipped here get corrupted.
  - name: rust-nightly
    buildsystem: simple
    build-options:
      strip: false
      no-debuginfo: true
    cleanup:
      - '*'
    sources:
      - type: archive
        only-arches:
          - aarch64
        dest: rust
        url: https://static.rust-lang.org/dist/2026-08-10/rust-nightly-aarch64-unknown-linux-gnu.tar.xz
        sha256: 41b5a977c8c975f3f81a2e565b6be920caf12bc6d5eea0b2b4f4208a39e24455
        # x-checker-data:
        #  type: rust
        #  package: rust
        #  channel: nightly
        #  target: aarch64-unknown-linux-gnu
      - type: archive
        only-arches:
          - x86_64
        dest: rust
        url: https://static.rust-lang.org/dist/2026-08-10/rust-nightly-x86_64-unknown-linux-gnu.tar.xz
        sha256: d802d6b565a10b9930df5da080df307db9347bc169ae973c58e1f1b8bfa6c669
        # x-checker-data:
        #  type: rust
        #  package: rust
        #  channel: nightly
        #  target: x86_64-unknown-linux-gnu
      - type: archive
        dest: rust-src
        url: https://static.rust-lang.org/dist/2026-08-10/rust-src-nightly.tar.xz
        sha256: 39627a42f9873f0c17d16e311e89caba82d319ad034e3f57399f1f3a8b051fa4
        # x-checker-data:
        #  type: rust
        #  package: rust-src
        #  channel: nightly
        #  target: '*'
    build-commands:
      - cd rust && ./install.sh --prefix=/app/lib/sdk/rust-nightly --without=rust-docs
        --without=rust-docs-json-preview --disable-ldconfig --verbose
      - cd rust-src && ./install.sh --prefix=/app/lib/sdk/rust-nightly --disable-ldconfig
        --verbose

  - name: rust-bindgen
    buildsystem: simple
    build-options:
      strip: false
      no-debuginfo: true
      prepend-path: /app/lib/sdk/rust-nightly/bin
      env:
        CARGO_HOME: /run/build/rust-bindgen/cargo
    build-commands:
      - cargo --offline fetch --manifest-path Cargo.toml --verbose
      - cargo --offline build --release --verbose
      - install -Dm 755 target/release/bindgen -t /app/lib/sdk/bindgen/bin
      - ln -s /app/lib/sdk/rust-nightly/bin/rustfmt /app/lib/sdk/bindgen/bin
    sources:
      - type: git
        url: https://chromium.googlesource.com/external/github.com/rust-lang/rust-bindgen
        commit: *bindgen_revision
      - ./generated-sources.bindgen.json
    cleanup:
      - '*'

  - name: chromium
    buildsystem: simple
    build-options:
      prepend-ld-library-path: /app/lib/sdk/rust-nightly/lib
    build-commands:
      - ./bootstrap.sh
      - ./build.sh
      - ./install.sh
    sources:
      - type: archive
        url: *chromium_url
        sha256: *chromium_sha256
      - type: shell
        commands:
          - rm -rf third_party/llvm-build
          - rm -rf third_party/rust-toolchain
      - type: archive
        url: *llvm_prebuilt_url
        sha256: *llvm_prebuilt_sha256
        dest: third_party/llvm-build/Release+Asserts
        strip-components: 0
        only-arches: [x86_64]
      - type: archive
        url: *rust_prebuilt_url
        sha256: *rust_prebuilt_sha256
        dest: third_party/rust-toolchain
        strip-components: 0
        only-arches: [x86_64]
      - type: shell
        commands:
          - rm -rf third_party/llvm
        only-arches: [aarch64]
      - type: git
        url: https://chromium.googlesource.com/external/github.com/llvm/llvm-project
        commit: *llvm_revision
        dest: third_party/llvm
        only-arches: [aarch64]
      - type: archive
        url: *rollup_arm64_url
        sha512: *rollup_arm64_sha512
        dest: third_party/devtools-frontend/src/node_modules/@rollup/rollup-linux-arm64-gnu
      - type: archive
        archive-type: zip
        url: *dawn_go_x64_url
        sha256: *dawn_go_x64_sha256
        dest: third_party/dawn/tools/golang/linux-amd64
        strip-components: 0
