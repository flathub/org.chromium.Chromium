on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

jobs:
  updater:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: aquaproj/aqua-installer@96a9bc20066c5bf5e275b41019cfc165b25f4e2e # v4.0.5
        with:
          aqua_version: v2.62.3
          working_directory: updater
          aqua_opts: ''  # remove '-l'

      - name: Configure git
        run: |
          set -ex
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Check for updates
        id: updater
        run: cd updater && ./update.nu --commit

      - if: steps.updater.outputs.changed
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          title: Updates for Chromium ${{ steps.updater.outputs.chromium-version }}
          body: '*Automatically generated by the `updater` workflow.*'
          branch: auto-update-${{ steps.updater.outputs.chromium-version }}-${{ steps.updater.outputs.short-tree }}
